# Publishes freycreates.nl on every push to main (including FREYbot's gig updates).
# Before publishing, it rebuilds assets/frey-cv.pdf from /cv and assets/frey-rider.pdf from /rider,
# so both downloads are always current.
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build the CV and rider PDFs
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/dev/null 2>&1 &
          cd .github/scripts
          npm install --no-save --no-audit --no-fund puppeteer-core@23.11.1
          export CHROME_PATH="$(command -v google-chrome)"
          node page-pdf.mjs http://127.0.0.1:8000/cv.html "$GITHUB_WORKSPACE/assets/frey-cv.pdf"
          node page-pdf.mjs http://127.0.0.1:8000/rider.html "$GITHUB_WORKSPACE/assets/frey-rider.pdf"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify IndexNow
        continue-on-error: true
        run: |
          curl -fsS -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data '{
              "host": "freycreates.nl",
              "key": "4796cf4a8f18b139b924af4342fe551e",
              "urlList": [
                "https://freycreates.nl/",
                "https://freycreates.nl/dj",
                "https://freycreates.nl/sitemap.xml"
              ]
            }'
