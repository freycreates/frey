    const { isSuccessful } = await staticrypt.handleDecryptionOfPage(normaliseer(p.value), $("staticrypt-remember").checked);
    if (!isSuccessful) {
      $("err").textContent = "Dat klopt niet helemaal. Probeer het nog eens.";
      p.setAttribute("aria-invalid", "true");
      p.select();
    }
  });
  $("staticrypt-password").addEventListener("input", function () {
    $("err").textContent = "";
    this.removeAttribute("aria-invalid");
  });
</script>
</body>
</html>
