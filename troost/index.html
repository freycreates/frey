      if (!isRememberEnabled) $("staticrypt-remember-label").classList.add("hidden");
    }
  };

  $("show").addEventListener("change", function (e) {
    const p = $("staticrypt-password");
    p.type = e.target.checked ? "text" : "password";
    p.focus();
  });

  $("staticrypt-form").addEventListener("submit", async function (e) {
    e.preventDefault();
    const p = $("staticrypt-password");
    const { isSuccessful } = await staticrypt.handleDecryptionOfPage(normaliseer(p.value), $("staticrypt-remember").checked);
    if (!isSuccessful) {
      $("err").textContent = "Dat klopt niet helemaal. Probeer het nog eens.";
      p.setAttribute("aria-invalid", "true");
      p.select();
    }
  });
  $("staticrypt-password").addEventListener("input", function () {
    $("err").textContent = "";
    this.removeAttribute("aria-invalid");
  });
</script>
</body>
</html>
