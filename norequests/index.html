<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>No requests | FREY.</title>
<meta name="description" content="No requests. This isn't Spotify, babe. Tips accepted though.">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0f0d10">
<link rel="icon" type="image/png" sizes="48x48" href="/assets/frey-icon-48.png">
<link rel="apple-touch-icon" href="/assets/frey-icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0f0d10;--text:#fff8fb;--muted:#a99ca5;--pink:#e61482;--ink:#191317;--paper:#fff8fb}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100svh;background:var(--bg);color:var(--text);font-family:"Inter Tight",system-ui,sans-serif;font-weight:500;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden;position:relative;isolation:isolate}
/* soft pink/violet glow, same mood as the homepage */
body:before{content:"";position:fixed;inset:-20%;z-index:-1;background:radial-gradient(40% 32% at 18% 22%,rgba(230,20,130,.34),transparent 70%),radial-gradient(42% 34% at 86% 62%,rgba(112,71,232,.30),transparent 70%),radial-gradient(40% 30% at 30% 96%,rgba(22,137,216,.22),transparent 70%)}
.page{width:min(100%,460px);min-height:100svh;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 22px max(26px,env(safe-area-inset-bottom));display:flex;flex-direction:column}
.brand{font-weight:900;font-size:28px;letter-spacing:-.045em;line-height:1;text-decoration:none;color:var(--text)}
.brand i{color:var(--pink);font-style:normal}

/* speech bubble */
.bubble{position:relative;margin:26px 0 0;padding:26px 24px 24px;background:var(--paper);color:var(--ink);border-radius:26px;box-shadow:0 18px 50px rgba(0,0,0,.45)}
.bubble:after{content:"";position:absolute;left:46%;bottom:-17px;width:34px;height:34px;background:var(--paper);border-radius:0 0 8px 0;transform:rotate(45deg) skew(8deg,8deg)}
.bubble h1{margin:0;font-weight:900;font-size:clamp(46px,15.5vw,68px);line-height:.9;letter-spacing:-.045em;text-transform:uppercase}
.bubble h1 i{color:var(--pink);font-style:normal}
.bubble p{margin:14px 0 0;font-weight:800;font-size:clamp(20px,6vw,25px);line-height:1.12;letter-spacing:-.025em}
.bubble p.tips{margin-top:12px;color:#756579;font-weight:700;font-size:clamp(17px,5vw,20px)}
.bubble p.tips b{color:var(--pink);font-weight:900}

/* dog: edges melt into the page */
.dog{position:relative;margin:-6px -22px 0;aspect-ratio:1/1.3;overflow:hidden;
  -webkit-mask-image:linear-gradient(to right,transparent 0,#000 24%,#000 76%,transparent 100%),linear-gradient(to bottom,transparent 0,#000 20%,#000 70%,transparent 100%);
  -webkit-mask-composite:source-in;
  mask-image:linear-gradient(to right,transparent 0,#000 24%,#000 76%,transparent 100%),linear-gradient(to bottom,transparent 0,#000 20%,#000 70%,transparent 100%);
  mask-composite:intersect}
.dog img{width:100%;height:100%;object-fit:cover;object-position:46% 50%;display:block}

.foot{margin-top:auto;padding-top:6px;text-align:center}
.foot .tag{margin:0;font-size:13px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:var(--muted)}
.foot .tag i{color:var(--pink);font-style:normal}
.foot a{display:inline-block;margin-top:14px;font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--text);text-decoration:none;border-bottom:2px solid var(--pink);padding-bottom:2px}
@media(prefers-reduced-motion:no-preference){.bubble{animation:pop .5s cubic-bezier(.2,.9,.3,1.2) backwards}.dog{animation:fade .8s ease .1s backwards}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.96)}}
@keyframes fade{from{opacity:0}}
</style>
</head>
<body>
<main class="page">
  <a class="brand" href="/">FREY<i>.</i></a>

  <section class="bubble" aria-label="The DJ says">
    <h1>No requests<i>.</i></h1>
    <p>This isn't Spotify, babe.</p>
    <p class="tips"><b>Tips</b> accepted though.</p>
  </section>

  <div class="dog"><img src="dog.jpg" alt="A cavalier puppy DJing with headphones around its neck" width="1280" height="720"></div>

</main>
</body>
</html>
